name: putmind
description: PutMind — Snap it. Say where. Find it later.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  cupertino_icons: ^1.0.8
  sqflite: ^2.4.2
  path: ^1.9.1
  path_provider: ^2.1.5
  camera: ^0.12.0+1
  # 13.x pulls permission_handler_android 14 which requires AGP 9 kotlin DSL.
  permission_handler: 11.4.0
  uuid: ^4.6.0
  shared_preferences: ^2.5.5
  flutter_secure_storage: 9.2.4
  crypto: ^3.0.7
  speech_to_text: ^7.4.0
  audioplayers: ^6.8.1
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1
  local_auth: ^3.0.2
  flutter_timezone: ^5.1.0
  cryptography: ^2.7.0
  archive: ^4.0.7
  file_picker: ^10.3.2
  in_app_purchase: ^3.2.3
  package_info_plus: ^8.3.0
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  sqflite_common_ffi: ^2.3.7+1
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/putmind_icon.png
  remove_alpha_ios: true
  # Match artwork edge cyan so iOS opaque canvas does not introduce a dark frame.
  background_color_ios: "#CBF2F5"
  # Solid adaptive background + artwork foreground (avoid double opaque layers).
  adaptive_icon_background: "#CBF2F5"
  adaptive_icon_foreground: assets/branding/putmind_icon.png
  # Keep artwork inside the adaptive safe zone across circle/squircle masks.
  adaptive_icon_foreground_inset: 12
  adaptive_icon_monochrome: assets/branding/putmind_icon_monochrome.png

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/branding/
    - assets/voice_guidance/
